<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script>(function(){try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);var c=localStorage.getItem("accentColor");if(c)document.documentElement.style.setProperty("--accent",c);}catch(e){}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Market News</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="appSidebar"></aside>
      <div class="app-main">
        <header class="page-header">
          <div>
            <h1>Market News</h1>
           
          </div>
          <div class="status-panel">
            <span id="newsDot" class="dot"></span>
            <span id="newsStatus">Starting</span>
            <strong id="newsCountdown">--</strong>
          </div>
        </header>

        <div class="page-content">
          <section class="news-controls">
            <form id="newsForm" class="news-form">
              <label for="newsQuery">Search news</label>
              <input id="newsQuery" name="query" type="text" placeholder="e.g. Nvidia, Fed, semiconductors">
              <button type="submit">Search</button>
              <button id="clearNews" type="button" class="secondary-btn">Reset</button>
              <label class="toggle-control" for="watchlistNews">
                <input id="watchlistNews" type="checkbox" checked>
                Watchlist
              </label>
            </form>
            <p id="newsHelper" class="helper-text">Showing latest market and watchlist headlines.</p>
          </section>


          <section id="newsList" class="news-list" aria-live="polite">
            <p class="loading">Loading realtime news...</p>
          </section>
        </div>
      </div>
    </div>
    <script src="/app-shell.js"></script>
    <script src="/theme.js"></script>
    <script src="/auth.js"></script>
    <script src="/ticker.js"></script>
    <script src="/news.js"></script>
  </body>
</html>
