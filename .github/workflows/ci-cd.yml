name: CI/CD

on:
  push:
    branches:
      - developer
      - main
  pull_request:
    branches:
      - developer
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build check
        run: npm run build

  deploy:
    name: Deploy to Render
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/developer'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Trigger Render deploy hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl --fail --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Skip deploy hook
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "Render autoDeploy is enabled in render.yaml. Add RENDER_DEPLOY_HOOK_URL to force deploys from Actions."
